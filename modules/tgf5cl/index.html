<section class="modulex-surec-kaskad{{fbsinif}}" {{fbetiket}}>

<style>
  /* surec-kaskad — Akış yönü çaprazdır (kaskad); sıralı ilerleme gözle takip edilir, ızgara ya da tek sütun değil. */
  .modulex-surec-kaskad { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-surec-kaskad *, .modulex-surec-kaskad *::before, .modulex-surec-kaskad *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-surec-kaskad :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-surec-kaskad :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-surec-kaskad :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-surec-kaskad :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-surec-kaskad img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-surec-kaskad) img { height: auto; }
  .modulex-surec-kaskad [hidden] { display: none !important; }
  .modulex-surec-kaskad :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-surec-kaskad :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-surec-kaskad-ic { max-width: --max--; margin-inline: auto; }
  .modulex-surec-kaskad-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-surec-kaskad--bassiz .modulex-surec-kaskad-bas { display: none; }
  .modulex-surec-kaskad-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-surec-kaskad-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-surec-kaskad-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-surec-kaskad-bas { max-width: 760px; }
  .modulex-surec-kaskad-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-surec-kaskad-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-surec-kaskad-dugme:hover { transform: translateY(-2px); }
  .modulex-surec-kaskad-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-surec-kaskad-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-surec-kaskad-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-surec-kaskad-kaskad { display: grid; gap: 28px; }
  .modulex-surec-kaskad-basamak { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; align-items: start; width: min(100%, 620px); margin-inline-start: calc(var(--k) * max(0px, 100% - 620px)); padding: 20px; border-radius: --yuvarlak--; background: --kartBg--; transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease; }
  .modulex-surec-kaskad-basamak:hover { box-shadow: 0 18px 36px -28px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-surec-kaskad-basamak + .modulex-surec-kaskad-basamak::before { content: ""; position: absolute; inset-block-end: 100%; inset-inline-start: 51px; height: 28px; border-inline-start: 2px dashed --accent--; }
  .modulex-surec-kaskad--hazir:not(.modulex-surec-kaskad--gor) .modulex-surec-kaskad-basamak { opacity: 0; transform: translateY(18px); }
  .modulex-surec-kaskad-no { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: --accent--; color: --accentText--; font-size: 1.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-surec-kaskad-ikon { font-size: 28px; }
  .modulex-surec-kaskad-yazi { display: grid; gap: 6px; }
  .modulex-surec-kaskad-kbaslik { font-size: 1.15rem; font-weight: 750; }
  .modulex-surec-kaskad-kmetin { color: --muted--; font-size: 0.95rem; }
  @media (max-width: 768px) {
    .modulex-surec-kaskad-basamak { width: auto; margin-inline-start: calc(var(--k) * 24px); grid-template-columns: 48px minmax(0, 1fr); gap: 14px; padding: 16px; }
    .modulex-surec-kaskad-no { width: 48px; height: 48px; font-size: 1.1rem; }
    .modulex-surec-kaskad-basamak + .modulex-surec-kaskad-basamak::before { inset-inline-start: 39px; }
  }
  .modulex-surec-kaskad-sure { display: inline-flex; align-items: center; gap: 6px; justify-self: start; width: fit-content; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, --accent-- 12%, transparent); color: --text--; font-size: 0.85rem; font-weight: 600; }
  .modulex-surec-kaskad-sure .material-symbols-outlined { font-size: 18px; color: --accentInk--; }
  .modulex-surec-kaskad-etiket { color: --accentInk--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }

  .modulex-surec-kaskad-bag { color: inherit; text-decoration: none; }
  .modulex-surec-kaskad-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-surec-kaskad-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-kaskad :is(.modulex-surec-kaskad-baslik, .modulex-surec-kaskad-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-surec-kaskad-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-surec-kaskad { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-surec-kaskad *, .modulex-surec-kaskad *::before, .modulex-surec-kaskad *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-surec-kaskad";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
