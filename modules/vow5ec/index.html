<section class="modulex-kt3" id="kt3-{{id}}">
  <div class="modulex-kt3-wrap">
    {{kt3basl}}
    <label class="modulex-kt3-fark" hidden>
      <input type="checkbox" data-kt3-fark />
      <span class="modulex-kt3-anahtar" aria-hidden="true"></span>
      <span>{{diffLabel}}</span>
    </label>
    <div class="modulex-kt3-kap" role="region" aria-label="{{tableLabel}}" tabindex="0">
      <table class="modulex-kt3-table">
        <thead><tr>{{kt3headrow}}</tr></thead>
        {{kt3body}}
      </table>
    </div>
  </div>
</section>

<style>
  /* Yapışkan başlıklı karşılaştırma (karsilastirma-tablo-3). Masaüstünde sarmalayıcıda overflow YOK → thead sayfaya göre yapışır. */
  .modulex-kt3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(40px, 7vw, 88px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-kt3 *, .modulex-kt3 *::before, .modulex-kt3 *::after { box-sizing: border-box; }
  .modulex-kt3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-kt3-wrap { max-width: --max--; margin-inline: auto; }
  .modulex-kt3-head { margin-block-end: 20px; }
  .modulex-kt3-title { margin: 0 0 8px; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem); line-height: 1.2; color: --textcolor--; }
  .modulex-kt3-desc { margin: 0; max-width: 64ch; line-height: 1.7; color: --mutedcolor--; }

  .modulex-kt3-fark { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 12px; cursor: pointer; font-weight: 600; }
  .modulex-kt3-fark[hidden] { display: none; }
  .modulex-kt3-fark input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .modulex-kt3-anahtar { position: relative; width: 44px; height: 24px; border-radius: 999px; background: --surface2--; border: 1px solid --bordercolor--; transition: background-color 0.2s ease; }
  .modulex-kt3-anahtar::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 18px; height: 18px; border-radius: 50%; background: --textcolor--; transition: inset-inline-start 0.2s ease; }
  .modulex-kt3-fark input:checked + .modulex-kt3-anahtar { background: --accent--; border-color: --accent--; }
  .modulex-kt3-fark input:checked + .modulex-kt3-anahtar::after { inset-inline-start: 22px; background: --accentText--; }
  .modulex-kt3-fark input:focus-visible + .modulex-kt3-anahtar { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-kt3-farkli .modulex-kt3-ayni { display: none; }

  /* görünmez (-sr) metinler absolute: kapsayıcı blok kaydırma alanı olsun, sayfayı taşırmasın */
  .modulex-kt3-kap { position: relative; }
  .modulex-kt3-kap:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-kt3-table { width: 100%; border-collapse: separate; border-spacing: 0; }
  .modulex-kt3-table thead th {
    position: sticky; top: --stickyTop--; z-index: 2; vertical-align: bottom;
    padding: 16px 12px; background: --bgcolor--; border-bottom: 2px solid --textcolor--; text-align: center;
  }
  .modulex-kt3-table thead th.modulex-kt3-ilk { text-align: start; font-weight: 700; color: --mutedcolor--; }
  .modulex-kt3-paket { min-width: 150px; }
  .modulex-kt3-rozet { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 999px; background: --accent--; color: --accentText--; font-size: 0.75rem; font-weight: 700; }
  .modulex-kt3-ad { display: block; font-size: 1.1rem; font-weight: 800; color: --textcolor--; }
  .modulex-kt3-fiyat { display: block; margin-top: 2px; font-size: 0.95rem; color: --mutedcolor--; }
  .modulex-kt3 a.modulex-kt3-btn, .modulex-kt3 a.modulex-kt3-btn:visited {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 10px; padding: 0 18px;
    border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; font-size: 0.9rem; text-decoration: none;
  }
  .modulex-kt3 a.modulex-kt3-btn:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-kt3-grup th {
    padding: 22px 12px 8px; text-align: start; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: --accent--; border-bottom: 1px solid --bordercolor--;
  }
  .modulex-kt3-satir th, .modulex-kt3-satir td { padding: 14px 12px; border-bottom: 1px solid --bordercolor--; }
  .modulex-kt3-satir th { text-align: start; font-weight: 500; }
  .modulex-kt3-satir td { text-align: center; }
  .modulex-kt3-satir:hover th, .modulex-kt3-satir:hover td { background: --surface--; }
  .modulex-kt3-satir td.modulex-kt3-oner { background: color-mix(in srgb, --accent-- 7%, --bgcolor--); }
  .modulex-kt3-evet { color: --accent--; }
  .modulex-kt3-hayir { color: --mutedcolor--; }
  .modulex-kt3-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    .modulex-kt3-kap { overflow-x: auto; }
    .modulex-kt3-table thead th { position: static; }
    .modulex-kt3-ilk { position: sticky; inset-inline-start: 0; z-index: 1; background: --bgcolor--; min-width: 140px; }
    .modulex-kt3-grup th { position: sticky; inset-inline-start: 0; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-kt3 *, .modulex-kt3 *::before, .modulex-kt3 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  /* «Yalnız farkları göster»: tüm paketlerde aynı satırlar (sunucu işaretli) gizlenir. JS yoksa anahtar gizli. */
  (function () {
    var kok = document.getElementById("kt3-{{id}}");
    if (!kok || kok.getAttribute("data-kt3-hazir") === "1") { return; }
    kok.setAttribute("data-kt3-hazir", "1");
    if (!kok.querySelector(".modulex-kt3-ayni")) { return; }
    var etiket = kok.querySelector(".modulex-kt3-fark");
    var kutu = kok.querySelector("[data-kt3-fark]");
    if (!etiket || !kutu) { return; }
    etiket.hidden = false;
    kutu.addEventListener("change", function () {
      if (kutu.checked) { kok.classList.add("modulex-kt3-farkli"); } else { kok.classList.remove("modulex-kt3-farkli"); }
    });
  })();
</script>
