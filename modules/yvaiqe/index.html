<style>
  /* sayac-cumle — Izgara ya da kart yok: tipografik dev yazı; rakamlar bir metnin kelimeleri gibi okunur (manifesto tonu). */
  .modulex-sayac-cumle { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-cumle *, .modulex-sayac-cumle *::before, .modulex-sayac-cumle *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-cumle :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-cumle :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-cumle :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-cumle :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-cumle img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-cumle) img { height: auto; }
  .modulex-sayac-cumle [hidden] { display: none !important; }
  .modulex-sayac-cumle :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-cumle :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-cumle-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-cumle-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-cumle--bassiz .modulex-sayac-cumle-bas { display: none; }
  .modulex-sayac-cumle-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-cumle-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-cumle-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-cumle-bas { max-width: 760px; }
  .modulex-sayac-cumle-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-cumle-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-cumle-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-cumle-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-cumle-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-cumle-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-cumle-cumle { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.9rem, 5vw, 4rem); font-weight: 700; line-height: 1.22; letter-spacing: -0.03em; }
  .modulex-sayac-cumle-parca { transition: opacity 0.3s ease; }
  .modulex-sayac-cumle-cumle:hover .modulex-sayac-cumle-parca { opacity: 0.45; }
  .modulex-sayac-cumle-cumle .modulex-sayac-cumle-parca:hover { opacity: 1; }
  .modulex-sayac-cumle-sayi { color: --accentInk--; font-variant-numeric: tabular-nums; text-decoration: underline transparent 0.08em; text-underline-offset: 0.12em; transition: text-decoration-color 0.3s ease; }
  .modulex-sayac-cumle-parca:hover .modulex-sayac-cumle-sayi { text-decoration-color: currentColor; }
  .modulex-sayac-cumle-ek { font-size: 0.7em; }
  .modulex-sayac-cumle-etiket { color: --text--; font-weight: 400; }
  .modulex-sayac-cumle-ayrac { color: --muted--; font-weight: 300; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-cumle-cumle { letter-spacing: 0; line-height: 1.5; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-cumle :is(.modulex-sayac-cumle-baslik, .modulex-sayac-cumle-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-cumle-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-cumle { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-cumle *, .modulex-sayac-cumle *::before, .modulex-sayac-cumle *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-cumle";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
    });
  })();
</script>
